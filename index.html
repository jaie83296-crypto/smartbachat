      border-radius: 9px;
      white-space: nowrap;

        if (savedConfig) {

        if (savedDeals) {

          renderDeals();
          return;
        } catch (e) {}
      }
    }

    function applySiteConfig() {
      document.getElementById("siteBrandName").textContent = siteConfig.brandName || "SmartBachat";
      const tg = siteConfig.telegramUrl || "https://t.me/";
      document.getElementById("topTelegramLink").href = tg;
      document.getElementById("bottomTelegramLink").href = tg;
    }

    async function fetchFromFirebase(dbUrl) {
      try {
        const cleanUrl = dbUrl.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/smartbachat.json`);
        if (!res.ok) return;
        const data = await res.json();
        if (data && Array.isArray(data.deals) && data.deals.length > 0) {
          allDeals = data.deals;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(allDeals));
        }
        if (data && data.config) {
          siteConfig = { ...siteConfig, ...data.config };
          localStorage.setItem(CONFIG_KEY, JSON.stringify(siteConfig));
          applySiteConfig();
        }
        renderDeals();
      } catch (err) {
        console.warn("Cloud sync skipped:", err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
      });

      const finBox = document.getElementById("financeFilterBox");
      finBox.classList.toggle("visible", tab === "finance");

      renderDeals();
    }

    function filterFinance(subType, btnEl) {
      currentFinanceFilter = subType;
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      renderDeals();
    }

    function calcDiscount(price, mrp, customText) {
      if (customText) return customText;
      const p = parseFloat(price);
      const m = parseFloat(mrp);
      if (!isNaN(p) && !isNaN(m) && m > p && m > 0) {
        const pct = Math.round(((m - p) / m) * 100);
        return `${pct}% OFF`;
      }
      return "Best Offer";
    }

    function buildCardHTML(item) {
      const isFinance = item.category === "finance";
      const priceDisplay = !isNaN(parseFloat(item.price)) ? `₹${item.price}` : item.price;
      const mrpDisplay = item.mrp
        ? (!isNaN(parseFloat(item.mrp)) ? `₹${item.mrp}` : item.mrp)
        : "";
      const disc = calcDiscount(item.price, item.mrp, item.discountText);
      const btnText = isFinance ? "✅ Apply Free / Claim Bonus →" : "🛒 Check Price / Buy Now →";

      return `
        <article class="deal-card ${isFinance ? 'finance-card' : ''}">
          <span class="code-pill">#${item.code}</span>
          ${item.badge ? `<span class="badge-pill">${item.badge}</span>` : ''}
          <div class="img-wrap">
            <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://placehold.co/400x400/e2e8f0/1e293b?text=Code+%23${item.code}'" />
          </div>
          <div class="card-body">
            <div>
              <div class="store-tag">${item.store || 'Verified Offer'}</div>
              <h3 class="deal-title">${item.title}</h3>
              ${item.desc ? `<p class="deal-desc">${item.desc}</p>` : ''}
            </div>
            <div>
              <div class="price-row">
                <span class="offer-price">${priceDisplay}</span>
                ${mrpDisplay ? `<span class="mrp-price">${mrpDisplay}</span>` : ''}
                <span class="discount-tag">${disc}</span>
              </div>
              <a href="${item.link}" target="_blank" rel="noopener" class="cta-btn" onclick="recordClick('${item.id}')">
                ${btnText}
              </a>
            </div>
          </div>
        </article>
      `;
    }

    function renderDeals() {
      const queryRaw = document.getElementById("codeSearchInput").value.trim();
      const query = queryRaw.replace(/^#/, "").toLowerCase();
      document.getElementById("clearSearchBtn").style.display = queryRaw ? "block" : "none";

      // Check exact code match first
      const exactBanner = document.getElementById("exactMatchBanner");
      const exactContainer = document.getElementById("exactMatchContainer");

      if (query && /^\d+$/.test(query)) {
        const exactItem = allDeals.find(d => String(d.code).toLowerCase() === query);
        if (exactItem) {
          exactBanner.style.display = "block";
          exactContainer.innerHTML = buildCardHTML(exactItem);
        } else {
          exactBanner.style.display = "none";
        }
      } else {
        exactBanner.style.display = "none";
      }

      // Filter list
      let filtered = allDeals.filter(item => {
        if (query) {
          const matchCode = String(item.code).toLowerCase().includes(query);
          const matchTitle = (item.title || "").toLowerCase().includes(query);
          const matchDesc = (item.desc || "").toLowerCase().includes(query);
          const matchStore = (item.store || "").toLowerCase().includes(query);
          return matchCode || matchTitle || matchDesc || matchStore;
        }

        if (currentTab === "all") {
          return true;
        }
        if (currentTab === "finance") {
          if (item.category !== "finance") return false;
          if (currentFinanceFilter !== "all" && item.subType !== currentFinanceFilter) return false;
          return true;
        }
        if (currentTab === "loot") {
          return item.category === "loot" || item.category === "gadget";
        }
        return true;
      });

      const grid = document.getElementById("dealsGrid");
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-box">
            <h3 style="margin-bottom:6px;">Koi matching deal nahi mili</h3>
            <p style="font-size:0.82rem;color:#64748b;">Code number dubara check karein (jaise 101, 102) ya "Viral Reel Codes" tab par click karein.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(buildCardHTML).join("");
    }

    function triggerSearch() {
      renderDeals();
    }

    function clearSearch() {
      document.getElementById("codeSearchInput").value = "";
      renderDeals();
    }

    function recordClick(dealId) {
      try {
        const idx = allDeals.findIndex(d => d.id === dealId);
        if (idx !== -1) {
          allDeals[idx].clicks = (allDeals[idx].clicks || 0) + 1;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(allDeals));
          if (siteConfig.firebaseDbUrl) {
            const cleanUrl = siteConfig.firebaseDbUrl.replace(/\/$/, "");
            fetch(`${cleanUrl}/smartbachat/deals/${idx}/clicks.json`, {
              method: "PUT",
              body: JSON.stringify(allDeals[idx].clicks)
            }).catch(() => {});
          }
        }
      } catch (e) {}
    }

    document.getElementById("codeSearchInput").addEventListener("input", renderDeals);
    window.addEventListener("storage", loadData);
    window.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
